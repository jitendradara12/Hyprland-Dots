# /* ---- 💫 https://github.com/LinuxBeginnings 💫 ---- */  #
# Hyprlock config for < 1080p monitor resolutions
# Design scaled 0.75x from hyprlock-2k.conf
# Original config submitted by https://github.com/SherLock707

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    fractional_scaling = 2
    immediate_render = true
}

# Fingerprint / PAM unlock (personal)
auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Touch fingerprint to unlock
        present_message = Scanning fingerprint...
    }
}

background {
    monitor =
    # NOTE: use only 1 path
    #path = screenshot   # screenshot of your desktop
    #path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_modified # by wallpaper effects
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current # current wallpaper

    color = rgb(0,0,0) # color will be rendered initially until path is available

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 7
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = $color13
    font_size = 17
    font_family = Victor Mono Bold Italic
    position = 0, -83
    halign = center
    valign = center
}

# Hour
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I")" # 12-hour
    color = $color15
    font_size = 180
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -100
    halign = center
    valign = top
}

# Minute
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $color14
    font_size = 180
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -338
    halign = center
    valign = top
}

# Seconds
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S %p")" # AM/PM
    color = $color13
    font_size = 38
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -341
    halign = center
    valign = top
}

# Optional image: uncomment one path to show a picture
image {
    monitor =
    # path = $HOME/Pictures/wallpapers/Dynamic-Wallpapers/Dark/kitty_dark.png
    # path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    size = 120
    rounding = -1
    border_size = 0
    border_color = $color11
    rotate = 0
    reload_time = -1
    position = 0, 300
    halign = center
    valign = bottom
}

# USER
label {
    monitor =
    text =   $USER
    color = $color9
    font_size = 21
    font_family = Victor Mono Bold Oblique
    position = 0, 165
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 230, 70
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $color8
    inner_color = rgba(255, 255, 255, 0.1)
    capslock_color = rgb(255,255,255)
    font_color = $color13
    fade_on_empty = false
    font_family = Victor Mono Bold Oblique
    placeholder_text = <i><span foreground="##ffffff99">🔒 Type Password</span></i>
    fail_text = <i><span foreground="##ffffff99">🔒 Type Password</span></i>
    hide_input = false
    position = 0, 75
    halign = center
    valign = bottom
}

# Keyboard LAYOUT
label {
    monitor =
    text = $LAYOUT
    color = $color8
    font_size = 11
    font_family = Victor Mono Bold Oblique
    position = 0, 53
    halign = center
    valign = bottom
}

# Fingerprint failure / lockout
label {
    monitor =
    text = $FPRINTFAIL
    color = $color11
    font_size = 9
    font_family = Victor Mono Bold Oblique
    position = 0, 36
    halign = center
    valign = bottom
}

# uptime
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p || $Scripts/UptimeNixOS.sh)" </b>"
    color = $color8
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 0, 0
    halign = right
    valign = bottom
}

# battery information
label {
    monitor =
    text = cmd[update:1000] echo "<b> "$($Scripts/Battery.sh)" </b>"
    color = $color8
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 0, 30
    halign = right
    valign = bottom
}

# weather edit the scripts for locations
# weather scripts are located in ~/.config/hypr/UserScripts Weather.sh and/or Weather.py
# see https://github.com/LinuxBeginnings/Hyprland-Dots/wiki/TIPS#%EF%B8%8F-weather-app-related-for-waybar-and-hyprlock
label {
    monitor =
    # text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache" # i don't need wind speed
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && sed -n '3,4p' "$HOME/.cache/.weather_cache"
    color = $color13
    font_size = 14
    font_family = Victor Mono Bold Oblique
    position = 8, 0
    halign = left
    valign = bottom
}
